<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Empréstimos </title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px; color: #333; background-color: #41afaa;">
    <h1>Simulador de Empréstimos</h1>
    <form id="loan-form">
        <label for="amount">Valor do Empréstimo:</label>
        <input type="number" id="amount" name="amount" required><br><br>

        <label for="term">Prazo (meses):</label>
        <input type="number" id="term" name="term" required><br><br>

        <button type="submit" style="background-color: #4CAF50; border: none; color: white; padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; margin: 4px 2px; cursor: pointer;">Calcular</button>
    </form>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>
